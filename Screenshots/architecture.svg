<line x1="290" y1="350" x2="340" y2="350" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="640" y1="300" x2="690" y2="150" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="640" y1="330" x2="690" y2="290" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
