<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570">
<rect width="1000" height="570" rx="10" fill="#0d1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">NumberBindingKit&#160;&#8212;&#160;every&#160;number&#160;in&#160;an&#160;answer,&#160;bound&#160;to&#160;what&#160;the&#160;turn&#160;returned</text>
<g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#c9d1d9">
<rect x="20" y="60" width="270" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="155.0" y="82" text-anchor="middle" font-weight="bold" fill="#79c0ff">Answer&#160;(plain&#160;prose)</text>
<text x="32" y="102">&quot;Your&#160;conversion&#160;rate&#160;was&#160;6.7%</text>
<text x="32" y="119">across&#160;48,210&#160;sessions&#160;...&quot;</text>
<rect x="20" y="160" width="270" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="155.0" y="182" text-anchor="middle" font-weight="bold" fill="#79c0ff">Evidence:&#160;NumberSource</text>
<text x="32" y="202">tool&#160;output&#160;&#160;{&quot;conversion_rate&quot;:0.057}</text>
<text x="32" y="219">document&#160;&#160;&#160;&#160;&#160;&quot;Q3&#160;revenue&#160;$1,234,567&quot;</text>
<text x="32" y="236">user&#160;message&#160;&quot;15%&#160;of&#160;2,340?&quot;</text>
<text x="32" y="253">earlier&#160;answer&#160;&#160;(echo&#160;only)</text>
<rect x="20" y="300" width="270" height="95" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="155.0" y="322" text-anchor="middle" font-weight="bold" fill="#d2a8ff">BindingPolicy</text>
<text x="32" y="342">.strict&#160;&#160;.standard&#160;&#160;.lenient</text>
<text x="32" y="359">rounding,&#160;rescale,&#160;convert,</text>
<text x="32" y="376">&quot;about&quot;&#160;tolerance,&#160;bounds,&#160;derivations</text>
<rect x="340" y="60" width="300" height="165" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="490.0" y="82" text-anchor="middle" font-weight="bold" fill="#79c0ff">FigureReader</text>
<text x="352" y="102">value,&#160;step&#160;(precision&#160;as&#160;written)</text>
<text x="352" y="119">scale:&#160;k&#160;M&#160;million&#160;bn&#160;lakh&#160;crore</text>
<text x="352" y="136">%&#160;/&#160;percent&#160;/&#160;percentage&#160;points</text>
<text x="352" y="153">unit&#160;family&#160;+&#160;factor&#160;(ms,&#160;GB,&#160;$)</text>
<text x="352" y="170">qualifier:&#160;about&#160;~&#160;over&#160;under&#160;&#8804;</text>
<text x="352" y="187">role:&#160;quantity&#160;year&#160;clock&#160;|&#160;exempt</text>
<text x="352" y="204">label:&#160;words&#160;in&#160;its&#160;clause,&#160;not</text>
<text x="352" y="221">past&#160;a&#160;neighbouring&#160;figure</text>
<rect x="340" y="245" width="300" height="215" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="490.0" y="267" text-anchor="middle" font-weight="bold" fill="#ffa657">NumberBinder&#160;(in&#160;order)</text>
<text x="352" y="287">1&#160;&#160;exempt&#160;role&#160;(iOS&#160;17,&#160;[3],&#160;2nd,&#160;1.)</text>
<text x="352" y="304">2&#160;&#160;direct&#160;match,&#160;strongest&#160;relation:</text>
<text x="352" y="321">&#160;&#160;&#160;&#160;&#160;exact&#160;rescaled&#160;converted&#160;rounded</text>
<text x="352" y="338">&#160;&#160;&#160;&#160;&#160;approximate&#160;withinBound</text>
<text x="352" y="355">3&#160;&#160;derived:&#160;sum&#160;diff&#160;product&#160;ratio</text>
<text x="352" y="372">&#160;&#160;&#160;&#160;&#160;percentChange&#160;percentOf</text>
<text x="352" y="389">4&#160;&#160;contradicted:&#160;same&#160;kind,&#160;shared</text>
<text x="352" y="406">&#160;&#160;&#160;&#160;&#160;label,&#160;nothing&#160;in&#160;lenient&#160;reach</text>
<text x="352" y="423">5&#160;&#160;echoed:&#160;only&#160;an&#160;earlier&#160;answer</text>
<text x="352" y="440">6&#160;&#160;small&#160;count,&#160;else&#160;unbound</text>
<rect x="690" y="60" width="290" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="835.0" y="82" text-anchor="middle" font-weight="bold" fill="#7ee787">NumberBindingReport</text>
<text x="702" y="102">verdict:&#160;allBound&#160;|&#160;unverified&#160;|</text>
<text x="702" y="119">&#160;&#160;&#160;&#160;contradicted&#160;|&#160;nothingToCheck</text>
<text x="702" y="136">note&#160;(one&#160;paragraph&#160;for&#160;the&#160;user)</text>
<text x="702" y="153">summary&#160;(one&#160;line&#160;for&#160;a&#160;trace)</text>
<text x="702" y="170">segments&#160;/&#160;annotated()</text>
<text x="702" y="187">boundFraction</text>
<rect x="690" y="230" width="290" height="115" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="835.0" y="252" text-anchor="middle" font-weight="bold" fill="#7ee787">BindingSession&#160;(actor)</text>
<text x="702" y="272">remembers&#160;earlier&#160;answers;</text>
<text x="702" y="289">a&#160;repeated&#160;number&#160;cannot</text>
<text x="702" y="306">vouch&#160;for&#160;itself:&#160;echoed</text>
<text x="702" y="323">running&#160;totals&#160;per&#160;conversation</text>
<rect x="690" y="365" width="290" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="835.0" y="387" text-anchor="middle" font-weight="bold" fill="#e6edf3">Fail-closed&#160;(PCN)</text>
<text x="702" y="407">no&#160;binding&#160;=&#160;unverified</text>
<text x="702" y="424">a&#160;stricter&#160;policy&#160;verifies&#160;a&#160;subset</text>
